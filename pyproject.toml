[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoned-mmp-atlas"
version = "0.2.0"
description = "Auditable medicinal-chemistry moves with reasons"
requires-python = ">=3.11"
dependencies = ["rdkit"]

[project.scripts]
reasoned-mmps = "reasoned_mmp.cli:main"

[tool.setuptools]
packages = ["reasoned_mmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
